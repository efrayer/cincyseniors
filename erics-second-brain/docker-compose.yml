# Joins your EXISTING Caddy network — no ingress is scaffolded here.
# Caddy reaches the app by service name; port 3111 is never published
# to the host.
services:
  erics-second-brain:
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-/erics_second_brain}
    container_name: erics-second-brain
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "3111"
      AUTH_PASSWORD_HASH: "scrypt$$db7c7717bc415a5856fc71fbc22fb254$$eabc34f3d109335889d04d434d27a03abb5e0ecc08cb3579d8694e864cef9a546d1f9909f01e82c8c728689cc1d9ce17ff92282b0e8594dd91ba0bfbe04b0eb9"
      COOKIE_SECURE: "false"
    volumes:
      - esb_data:/data
    networks:
      - caddy

volumes:
  esb_data:

networks:
  caddy:
    external: true
    # ↓ the Docker network your Caddy container is on
    #   (find it with: docker network ls)
    name: webstack_webnet
